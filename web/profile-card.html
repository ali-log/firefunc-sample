<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Card · firefunc-sample</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafaf9;
        --card: #ffffff;
        --border: #e7e5e4;
        --ink: #1c1917;
        --muted: #78716c;
        --brand: #ea580c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        width: 360px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
      }
      /*
        BUG (visual / contrast): the greeting heading colour is #f5f5f4 —
        nearly the same as the white card. The text is present and correct in
        the DOM, but renders effectively invisible. The fix is a colour change
        to a readable ink tone (e.g. var(--ink)). There is no clean unit test
        for "is this readable" — the screenshot is the spec.
      */
      .greeting {
        color: var(--ink);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 18px 0 4px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .stats {
        display: flex;
        gap: 28px;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .stat strong {
        display: block;
        font-size: 18px;
        color: var(--ink);
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="avatar">A</div>
      <h1 class="greeting">Welcome back, Alex 👋</h1>
      <p class="subtitle">You have 3 new notifications.</p>
      <div class="stats">
        <div class="stat"><strong>128</strong><span>Projects</span></div>
        <div class="stat"><strong>1,204</strong><span>Commits</span></div>
        <div class="stat"><strong>17</strong><span>Reviews</span></div>
      </div>
    </main>
  </body>
</html>
