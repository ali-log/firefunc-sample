<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Calculator · firefunc-sample</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafaf9;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --primary: #ea580c;
        --primary-hover: #c2410c;
        --result-bg: #f5f5f4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        width: min(440px, 92vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
        background: #fff;
        color: var(--text);
      }
      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 11px 16px;
        background: var(--primary);
        color: #fff;
        border: 0;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
      .result {
        margin-top: 18px;
        padding: 14px 16px;
        background: var(--result-bg);
        border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
        line-height: 1.6;
        min-height: 90px;
      }
      .result strong {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Tip Calculator</h1>
      <p class="subtitle">Split a bill across guests with a tip percentage.</p>

      <label for="bill">Bill total ($)</label>
      <input id="bill" type="number" step="0.01" placeholder="120.00" />

      <label for="tip">Tip (%)</label>
      <input id="tip" type="number" step="1" value="15" />

      <label for="guests">Guests</label>
      <input id="guests" type="number" step="1" placeholder="4" />

      <button id="calc-btn">Calculate</button>

      <div class="result" id="result" aria-live="polite">
        Enter a bill, tip %, and guest count, then click Calculate.
      </div>
    </main>

    <script type="module" src="./tip-calculator.js"></script>
  </body>
</html>
